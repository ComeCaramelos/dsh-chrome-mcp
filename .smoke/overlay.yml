# Smoke-boot overlay: load the chrome-devtools-mcp plugin from the workspace
# source. `name` is anchored beside this file by the dsh patch loader, so it
# works from any clone: run `dsh web` from the repo root.
- insert:
    - id: mcp-chrome
      name: '../lib/index.js'
      config:
        serverName: chrome
        extraFlags: ['--no-usage-statistics', '--no-performance-crux']
